services:
  - type: web
    name: screener-order-analyzer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: SCREENER_SESSION_ID
        sync: false  # Add manually in Render dashboard
